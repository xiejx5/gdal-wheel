name: GDAL wheel

on:
  schedule:
    # Check for a new stable GDAL release once a month.
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      gdal_version:
        description: Stable GDAL version (blank selects latest upstream)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CIBW_SKIP: "*-musllinux*"
  CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2025.11.09-2
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.python.outputs.ready }}
      python_versions: ${{ steps.python.outputs.python_versions }}
      cibw_build: ${{ steps.python.outputs.cibw_build }}
      cibuildwheel_version: ${{ steps.python.outputs.cibuildwheel_version }}
      github_state: ${{ steps.decide.outputs.github_state }}
      pypi_exists: ${{ steps.decide.outputs.pypi_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - id: resolve
        name: Verify official release and Python sdist
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.gdal_version || '' }}
        run: python ci/sources.py --version "$REQUESTED_VERSION"

      - id: decide
        name: Check GitHub Release and PyPI state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gdal-v${VERSION}"
          state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"

          pypi_status="$(curl --retry 3 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/gdal-wheel/${VERSION}/json")"
          case "$pypi_status" in
            200) pypi_exists=true ;;
            404) pypi_exists=false ;;
            *)
              echo "Unexpected PyPI status: $pypi_status" >&2
              exit 1
              ;;
          esac

          echo "github_state=$state" >> "$GITHUB_OUTPUT"
          echo "pypi_exists=$pypi_exists" >> "$GITHUB_OUTPUT"

          if [[ "$state" == "false" && "$pypi_exists" == "true" ]]; then
            echo "check=false" >> "$GITHUB_OUTPUT"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cibuildwheel
        if: steps.decide.outputs.check == 'true'
        run: python -m pip install -q 'cibuildwheel>=4,<5'

      - id: python
        name: Select proven Python versions
        if: steps.decide.outputs.check == 'true'
        env:
          GDAL_VERSION: ${{ steps.resolve.outputs.version }}
        run: python ci/python-versions.py

      - name: Mark build attempt
        if: steps.python.outputs.ready == 'true' && steps.decide.outputs.github_state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          gh release create "gdal-v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GDAL ${VERSION} wheels" \
            --notes "Build in progress." \
            --draft

      - uses: actions/upload-artifact@v7
        if: steps.python.outputs.ready == 'true'
        with:
          name: verified-source
          path: |
            build/release.json
            build/gdal.tar.gz
            build/bindings.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    needs: source
    if: needs.source.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-2022
            platform: windows-x86_64
            arch: AMD64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      BUILD_PREFIX: ${{ github.workspace }}/gdal-libs
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD: ${{ needs.source.outputs.cibw_build }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      - name: Restore native SDK cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v4-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*', 'ci/build-native.py', 'ci/build-native-windows.ps1') }}-${{ needs.source.outputs.version }}
          restore-keys: |
            native-v4-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*', 'ci/build-native.py', 'ci/build-native-windows.ps1') }}-${{ needs.source.outputs.version }}-
            native-v4-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*', 'ci/build-native.py', 'ci/build-native-windows.ps1') }}-

      - name: Install host native build tools
        if: runner.os != 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: python -m pip install -U cmake ninja

      - name: Activate MSVC
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows shared SDK
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/build-native-windows.ps1

      - name: Build macOS shared SDK
        if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_ARCHITECTURES: arm64
        run: python ci/build-native.py

      - name: Prepare macOS/Windows bindings
        if: runner.os != 'Linux'
        run: python ci/prepare-bindings.py

      - name: Build Linux SDK in manylinux_2_28
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              dnf -y --setopt=install_weak_deps=False install perl-core
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install --no-cache-dir -U cmake ninja
              python ci/build-native.py
              python ci/prepare-bindings.py
            '

      - name: Prepare Linux bindings from cached SDK
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python ci/prepare-bindings.py
            '

      - name: Save complete native SDK cache
        id: save-native
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v4-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*', 'ci/build-native.py', 'ci/build-native-windows.ps1') }}-${{ needs.source.outputs.version }}

      - name: Install cibuildwheel
        run: python -m pip install -q "cibuildwheel==${{ needs.source.outputs.cibuildwheel_version }}"

      - name: Build and repair Python wheels
        env:
          CIBW_ENVIRONMENT_LINUX: BUILD_PREFIX=/project/gdal-libs PATH=/project/gdal-libs/bin:$PATH LD_LIBRARY_PATH=/project/gdal-libs/lib
          CIBW_ENVIRONMENT_MACOS: BUILD_PREFIX="${{ github.workspace }}/gdal-libs" PATH="${{ github.workspace }}/gdal-libs/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel==1.13.1
          CIBW_REPAIR_WHEEL_COMMAND: python {project}/ci/repair-wheel.py {wheel} {dest_dir}
        run: python -m cibuildwheel build/python --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Preserve native configuration on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-${{ matrix.platform }}
          path: |
            build/native/*-build/CMakeCache.txt
            build/native/*-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Save partial native cache after failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true' && steps.save-native.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v4-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*', 'ci/build-native.py', 'ci/build-native-windows.ps1') }}-${{ needs.source.outputs.version }}-partial-${{ github.run_id }}

  clean-test:
    needs: [source, build]
    if: needs.source.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64

    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.target.platform }}
          path: wheelhouse

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Test all Python wheels
        env:
          PYTHON_VERSIONS: ${{ needs.source.outputs.python_versions }}
        run: python ci/clean-test.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.target.platform }}
          path: results/
          if-no-files-found: ignore

  manifest:
    needs: [source, clean-test]
    if: needs.source.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results

      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      - run: python -m pip install -q packaging

      - name: Gate complete release
        env:
          REPOSITORY: ${{ github.repository }}
        run: python ci/generate-manifest.py --repository "$REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: wheelhouse/*
          if-no-files-found: error
          compression-level: 0

  publish_pypi:
    name: Publish gdal-wheel to PyPI
    needs: [source, manifest]
    if: needs.source.outputs.should_build == 'true' && needs.source.outputs.pypi_exists != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gdal-wheel
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-release
          path: release

      - name: Select PyPI wheels only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/gdal_wheel-*.whl dist/
          test -n "$(find dist -maxdepth 1 -name 'gdal_wheel-*.whl' -print -quit)"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  publish_github:
    name: Publish GitHub Release
    needs: [source, manifest, publish_pypi]
    if: >-
      always() &&
      needs.source.outputs.should_build == 'true' &&
      needs.manifest.result == 'success' &&
      needs.source.outputs.github_state != 'false' &&
      (needs.publish_pypi.result == 'success' || needs.publish_pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-release
          path: release

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Prepare GDAL wheels for GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q wheel
          mkdir -p github unpacked

          for file in release/gdal_wheel-*.whl; do
            rm -rf unpacked/*
            python -m wheel unpack "$file" -d unpacked
            dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)"
            info="$(find "$dir" -maxdepth 1 -type d -name 'gdal_wheel-*.dist-info' -print -quit)"
            new_info="$(basename "$info" | sed 's/^gdal_wheel-/GDAL-/')"
            mv "$info" "$dir/$new_info"
            sed -i 's/^Name: gdal-wheel$/Name: GDAL/' "$dir/$new_info/METADATA"

            data="$(find "$dir" -maxdepth 1 -type d -name 'gdal_wheel-*.data' -print -quit)"
            if [[ -n "$data" ]]; then
              mv "$data" "$dir/$(basename "$data" | sed 's/^gdal_wheel-/GDAL-/')"
            fi

            python -m wheel pack "$dir" -d github
          done

          base="https://github.com/${REPOSITORY}/releases/download/gdal-v${VERSION}"
          {
            echo '<!doctype html><html><body>'
            for file in github/GDAL-*.whl; do
              name="$(basename "$file")"
              hash="$(sha256sum "$file" | cut -d' ' -f1)"
              printf '<a href="%s/%s#sha256=%s">%s</a><br>\n' "$base" "$name" "$hash" "$name"
            done
            echo '</body></html>'
          } > github/index.html

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gdal-v${VERSION}"
          state="$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"

          if [[ "$state" == "true" ]]; then
            gh release upload "$tag" github/* --repo "$REPOSITORY" --clobber
          elif [[ "$state" == "missing" ]]; then
            gh release create "$tag" github/* \
              --repo "$REPOSITORY" \
              --target "$TARGET" \
              --title "GDAL ${VERSION} wheels" \
              --notes "Self-contained GDAL ${VERSION} wheels for the flat package index." \
              --draft
          else
            echo "$tag is already published; leaving it unchanged."
            exit 0
          fi

          gh release edit "$tag" --repo "$REPOSITORY" --draft=false
