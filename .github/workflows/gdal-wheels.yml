name: GDAL wheels

on:
  workflow_dispatch:
    inputs:
      gdal_version:
        description: Stable GDAL version (blank selects latest upstream)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
  CIBW_SKIP: '*-musllinux*'
  CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2025.11.09-2
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: resolve
        name: Verify official release and Python sdist
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.gdal_version }}
        run: python ci/sources.py --version "$REQUESTED_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-source
          path: |
            build/release.json
            build/gdal.tar.gz
            build/bindings.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-2022
            platform: windows-x86_64
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      BUILD_PREFIX: ${{ github.workspace }}/gdal-libs
      CIBW_ARCHS: ${{ matrix.arch }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      # Exact hits skip native compilation completely. Prefix restores from an
      # older GDAL version or recipe still reuse unchanged dependency stamps.
      - name: Restore native SDK cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}
          restore-keys: |
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}-
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-

      - name: Install host native build tools
        if: runner.os != 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: python -m pip install -r ci/build-requirements.txt

      - name: Activate MSVC
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows shared SDK
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/build-native-windows.ps1

      - name: Build macOS shared SDK
        if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_ARCHITECTURES: arm64
        run: python ci/build-native.py

      - name: Prepare macOS/Windows bindings
        if: runner.os != 'Linux'
        run: python ci/prepare-bindings.py

      - name: Build Linux SDK in manylinux_2_28
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              dnf -y --setopt=install_weak_deps=False install perl-core
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install --no-cache-dir -r ci/native-requirements.txt
              python ci/build-native.py
              python ci/prepare-bindings.py
            '

      - name: Prepare Linux bindings from cached SDK
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit == 'true'
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc 'export PATH=/opt/python/cp312-cp312/bin:$PATH; python ci/prepare-bindings.py'

      # Save the complete native SDK before building Python ABIs. If a wheel
      # build fails later, the expensive native work is already cached.
      - name: Save complete native SDK cache
        id: save-native
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}

      # Rasterio uses the cibuildwheel action directly. Doing the same keeps the
      # workflow small and avoids installing another host copy of cibuildwheel.
      - name: Build and repair Python wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: build/python
          output-dir: wheelhouse
        env:
          CIBW_ENVIRONMENT_LINUX: BUILD_PREFIX=/project/gdal-libs PATH=/project/gdal-libs/bin:$PATH LD_LIBRARY_PATH=/project/gdal-libs/lib
          CIBW_ENVIRONMENT_MACOS: BUILD_PREFIX="${{ github.workspace }}/gdal-libs" PATH="${{ github.workspace }}/gdal-libs/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_ENVIRONMENT_WINDOWS: BUILD_PREFIX="${{ github.workspace }}/gdal-libs"
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel==1.13.1
          CIBW_REPAIR_WHEEL_COMMAND: python {project}/ci/repair-wheel.py {wheel} {dest_dir}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Preserve native configuration on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-${{ matrix.platform }}
          path: |
            build/native/*-build/CMakeCache.txt
            build/native/*-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      # If native compilation itself failed before the complete cache was saved,
      # preserve completed dependency stamps for the next retry.
      - name: Save partial native cache after failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true' && steps.save-native.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}-partial-${{ github.run_id }}

  clean-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.target.platform }}
          path: wheelhouse
      - name: Test repaired wheel on a fresh runner
        run: python ci/clean-test.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.target.platform }}-${{ matrix.python }}
          path: |
            test-result.json
            feature-tests.xml
          if-no-files-found: error

  manifest:
    needs: [source, clean-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build
      - run: python -m pip install packaging
      - name: Gate complete release and generate hashes/index
        env:
          REPOSITORY: ${{ github.repository }}
        run: python ci/generate-manifest.py --repository "$REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: wheelhouse/*
          if-no-files-found: error
          compression-level: 0
