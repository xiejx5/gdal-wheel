name: GDAL wheels

on:
  workflow_dispatch:
    inputs:
      gdal_version:
        description: Stable GDAL version (blank selects latest upstream)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: gdal-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
  CIBW_SKIP: '*-musllinux*'
  CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2025.11.09-2
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: resolve
        name: Verify official release and Python sdist
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.gdal_version }}
        run: python ci/sources.py --version "$REQUESTED_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-source
          path: |
            build/release.json
            build/gdal.tar.gz
            build/bindings.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-2022
            platform: windows-x86_64
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      BUILD_PREFIX: ${{ github.workspace }}/gdal-libs
      CIBW_ARCHS: ${{ matrix.arch }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/build/vcpkg-cache,readwrite'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      - name: Install build tools
        run: python -m pip install -r ci/build-requirements.txt

      # The cache key is deliberately independent of workflow/script edits.
      # Fine-grained stamps in build-native.py decide what actually needs rebuilding.
      - name: Restore native cache
        id: native-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v2-${{ matrix.os }}-${{ hashFiles('ci/dependencies.json', 'ci/native-requirements.txt', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ needs.source.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            native-v2-${{ matrix.os }}-${{ hashFiles('ci/dependencies.json', 'ci/native-requirements.txt', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ needs.source.outputs.version }}-
            native-v2-${{ matrix.os }}-${{ hashFiles('ci/dependencies.json', 'ci/native-requirements.txt', 'ci/vcpkg.json', 'ci/triplets/*') }}-

      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows shared SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/build-native-windows.ps1

      - name: Build macOS shared SDK
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_ARCHITECTURES: arm64
        run: python ci/build-native.py

      - name: Prepare upstream bindings
        if: runner.os != 'Linux'
        run: python ci/prepare-bindings.py

      - name: Build Linux SDK in manylinux_2_28
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              dnf -y --setopt=install_weak_deps=False install perl-IPC-Cmd
              dnf clean all
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install -r ci/native-requirements.txt
              python ci/build-native.py
              python ci/prepare-bindings.py
            '

      - name: Build and repair Python wheels
        env:
          CIBW_ENVIRONMENT_LINUX: 'BUILD_PREFIX=/project/gdal-libs PATH=/project/gdal-libs/bin:$PATH LD_LIBRARY_PATH=/project/gdal-libs/lib'
          CIBW_ENVIRONMENT_MACOS: 'BUILD_PREFIX="${{ github.workspace }}/gdal-libs" PATH="${{ github.workspace }}/gdal-libs/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0'
          CIBW_ENVIRONMENT_WINDOWS: 'BUILD_PREFIX="${{ github.workspace }}/gdal-libs"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install delvewheel==1.13.1'
          CIBW_REPAIR_WHEEL_COMMAND: 'python {project}/ci/repair-wheel.py {wheel} {dest_dir}'
        run: python -m cibuildwheel build/python --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

      # Save even after a failed native build. Completed dependency stamps make
      # the next run resume instead of recompiling everything from scratch.
      - name: Save native cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v2-${{ matrix.os }}-${{ hashFiles('ci/dependencies.json', 'ci/native-requirements.txt', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ needs.source.outputs.version }}-${{ github.run_id }}

      - name: Preserve native configuration
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-${{ matrix.platform }}
          path: |
            build/native/*-build/CMakeCache.txt
            build/native/*-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  clean-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.target.platform }}
          path: wheelhouse
      - name: Test repaired wheel on a fresh runner
        run: python ci/clean-test.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.target.platform }}-${{ matrix.python }}
          path: |
            test-result.json
            feature-tests.xml
          if-no-files-found: error

  manifest:
    needs: [source, clean-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build
      - run: python -m pip install packaging
      - name: Gate complete release and generate hashes/index
        env:
          REPOSITORY: ${{ github.repository }}
        run: python ci/generate-manifest.py --repository "$REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: wheelhouse/*
          if-no-files-found: error
          compression-level: 0
