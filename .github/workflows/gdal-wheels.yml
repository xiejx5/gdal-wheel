name: GDAL wheels

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      gdal_version:
        description: Stable GDAL version (blank selects latest upstream)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CIBW_SKIP: '*-musllinux*'
  CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2025.11.09-2
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
      python_versions: ${{ steps.python.outputs.python_versions }}
      cibw_build: ${{ steps.python.outputs.cibw_build }}
      cibuildwheel_version: ${{ steps.python.outputs.cibuildwheel_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - id: resolve
        name: Verify official release and Python sdist
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.gdal_version || '' }}
        run: python ci/sources.py --version "$REQUESTED_VERSION"

      - id: decide
        name: Skip already published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gdal-v${VERSION}"
          state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [[ "$state" == "false" ]]; then
            echo "$tag is already published; nothing to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $tag."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cibuildwheel
        if: steps.decide.outputs.should_build == 'true'
        run: python -m pip install -q 'cibuildwheel>=4,<5'

      - id: python
        name: Select latest four supported CPython versions
        if: steps.decide.outputs.should_build == 'true'
        run: python ci/python-versions.py

      - uses: actions/upload-artifact@v7
        if: steps.decide.outputs.should_build == 'true'
        with:
          name: verified-source
          path: |
            build/release.json
            build/gdal.tar.gz
            build/bindings.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    needs: source
    if: needs.source.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-2022
            platform: windows-x86_64
            arch: AMD64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    env:
      BUILD_PREFIX: ${{ github.workspace }}/gdal-libs
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD: ${{ needs.source.outputs.cibw_build }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      - name: Restore native SDK cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}
          restore-keys: |
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}-
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-
            native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-

      - name: Install host native build tools
        if: runner.os != 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: python -m pip install -r ci/build-requirements.txt

      - name: Activate MSVC
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows shared SDK
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/build-native-windows.ps1

      - name: Build macOS shared SDK
        if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
          CMAKE_OSX_ARCHITECTURES: arm64
        run: python ci/build-native.py

      - name: Prepare macOS/Windows bindings
        if: runner.os != 'Linux'
        run: python ci/prepare-bindings.py

      - name: Build Linux SDK in manylinux_2_28
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              dnf -y --setopt=install_weak_deps=False install perl-core
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install --no-cache-dir -r ci/native-requirements.txt
              python ci/build-native.py
              python ci/prepare-bindings.py
            '

      - name: Prepare Linux bindings from cached SDK
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e BUILD_PREFIX=/project/gdal-libs \
            "$CIBW_MANYLINUX_X86_64_IMAGE" \
            bash -euc '
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python ci/prepare-bindings.py
            '

      - name: Save complete native SDK cache
        id: save-native
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}

      - name: Install cibuildwheel
        run: python -m pip install -q "cibuildwheel==${{ needs.source.outputs.cibuildwheel_version }}"

      - name: Build and repair Python wheels
        env:
          CIBW_ENVIRONMENT_LINUX: BUILD_PREFIX=/project/gdal-libs PATH=/project/gdal-libs/bin:$PATH LD_LIBRARY_PATH=/project/gdal-libs/lib
          CIBW_ENVIRONMENT_MACOS: BUILD_PREFIX="${{ github.workspace }}/gdal-libs" PATH="${{ github.workspace }}/gdal-libs/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel==1.13.1
          CIBW_REPAIR_WHEEL_COMMAND: python {project}/ci/repair-wheel.py {wheel} {dest_dir}
        run: python -m cibuildwheel build/python --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Preserve native configuration on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-${{ matrix.platform }}
          path: |
            build/native/*-build/CMakeCache.txt
            build/native/*-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Save partial native cache after failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true' && steps.save-native.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            gdal-libs
            build/downloads
            build/vcpkg-cache
          key: native-v3-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json', 'ci/vcpkg.json', 'ci/triplets/*') }}-${{ hashFiles('ci/native-requirements.txt', 'ci/native-cache-version.txt') }}-${{ needs.source.outputs.version }}-partial-${{ github.run_id }}

  clean-test:
    needs: [source, build]
    if: needs.source.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.source.outputs.python_versions) }}
        target:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64

    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.target.platform }}
          path: wheelhouse

      - name: Test repaired wheel on a fresh runner
        run: python ci/clean-test.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.target.platform }}-${{ matrix.python }}
          path: |
            test-result.json
            feature-tests.xml
          if-no-files-found: ignore

  manifest:
    needs: [source, clean-test]
    if: needs.source.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results

      - uses: actions/download-artifact@v8
        with:
          name: verified-source
          path: build

      - run: python -m pip install -q packaging

      - name: Gate complete release and generate hashes/index
        env:
          REPOSITORY: ${{ github.repository }}
        run: python ci/generate-manifest.py --repository "$REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: wheelhouse/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [source, manifest]
    if: needs.source.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-release
          path: release

      - name: Upload tested wheels and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gdal-v${VERSION}"
          state="$(gh release view "$tag" --repo "$REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"

          if [[ "$state" == "true" ]]; then
            gh release upload "$tag" release/* --repo "$REPOSITORY" --clobber
          elif [[ "$state" == "missing" ]]; then
            gh release create "$tag" release/* \
              --repo "$REPOSITORY" \
              --target "$TARGET" \
              --title "GDAL ${VERSION} wheels" \
              --notes "Self-contained GDAL ${VERSION} wheels for the latest four stable CPython versions supported by cibuildwheel. All 12 wheel/platform combinations passed clean-runner tests." \
              --draft
          else
            echo "$tag is already published; leaving it unchanged."
            exit 0
          fi

          gh release edit "$tag" --repo "$REPOSITORY" --draft=false
